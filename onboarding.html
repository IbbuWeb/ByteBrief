<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171410">
  <meta name="description" content="Choose the tech topics you care about to personalize your ByteBrief feed.">
  <meta name="author" content="ByteBrief">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://ibbuweb.github.io/ByteBrief/onboarding.html">
  <meta property="og:title" content="Choose your topics — ByteBrief">
  <meta property="og:description" content="Pick a few topics and ByteBrief will rank the feed around them.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/bytebrief-logo.png">
  <link rel="apple-touch-icon" href="assets/bytebrief-logo.png">
  <link rel="manifest" href="manifest.json">
  <title>Choose your topics — ByteBrief</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="onboarding-page">
  <main class="onboarding-shell">
    <div class="cluster" style="justify-content: space-between; margin-bottom: 18px;">
      <a class="brand" href="index.html">
        <img class="brand-wordmark" src="assets/bytebrief-wordmark.png" alt="ByteBrief" width="500" height="96">
      </a>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>

    <section class="onboarding-card" aria-labelledby="onboardingTitle">
      <div class="onboarding-head">
        <div>
          <span class="eyebrow">One last step</span>
          <h1 id="onboardingTitle">What do you want to read?</h1>
          <p>Pick at least one topic. The feed still shows everything; your topics add a “For you” ranking and power the filter chips.</p>
        </div>
        <span class="pill" id="onboardingState">Loading your account…</span>
      </div>

      <div class="onboarding-grid" id="interestGrid" role="group" aria-label="Select your interests">
        <label class="interest-option onboarding-option">
          <input type="checkbox" name="interests" value="ai">
          <span class="interest-content">
            <svg class="interest-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/></svg>
            <strong>AI</strong>
            <span>Models, agents, research, and the business around them.</span>
          </span>
        </label>

        <label class="interest-option onboarding-option">
          <input type="checkbox" name="interests" value="programming">
          <span class="interest-content">
            <svg class="interest-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16,18 22,12 16,6"/><polyline points="8,6 2,12 8,18"/></svg>
            <strong>Programming</strong>
            <span>Languages, frameworks, developer tools, and open source.</span>
          </span>
        </label>

        <label class="interest-option onboarding-option">
          <input type="checkbox" name="interests" value="hardware">
          <span class="interest-content">
            <svg class="interest-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="14"/><line x1="10" y1="10" x2="10" y2="14"/><line x1="14" y1="10" x2="14" y2="14"/><line x1="18" y1="10" x2="18" y2="14"/></svg>
            <strong>Hardware</strong>
            <span>Chips, devices, laptops, and the machines underneath.</span>
          </span>
        </label>

        <label class="interest-option onboarding-option">
          <input type="checkbox" name="interests" value="startups">
          <span class="interest-content">
            <svg class="interest-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <strong>Startups</strong>
            <span>Founders, funding, product launches, and the next wave.</span>
          </span>
        </label>

        <label class="interest-option onboarding-option">
          <input type="checkbox" name="interests" value="cybersecurity">
          <span class="interest-content">
            <svg class="interest-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
            <strong>Cybersecurity</strong>
            <span>Breaches, privacy, defense, and the people doing the work.</span>
          </span>
        </label>
      </div>

      <div class="onboarding-foot">
        <span class="onboarding-count" id="selectedCount" role="status" aria-live="polite">No topics selected yet</span>
        <div class="cluster">
          <a class="btn btn-ghost" href="index.html">Read without saving</a>
          <button type="button" class="btn btn-primary" id="continueBtn" disabled>Save and continue</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-message"></span>
  </div>

  <script type="module" src="js/onboarding.js"></script>
</body>
</html>
