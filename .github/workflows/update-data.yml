name: Refresh data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test feed parser
        run: node --test scripts/lib/parse-feed.test.js

      - name: Refresh data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-data.js

      - name: Commit if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add js/data.json
          git diff --staged --quiet || git commit -m "Refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
