<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171410">
  <meta name="description" content="ByteHub: GitHub trending repositories, a verified tech conference calendar, latest podcast episodes, and every publication ByteBrief reads.">
  <meta name="author" content="ByteBrief">
  <link rel="canonical" href="https://ibbuweb.github.io/ByteBrief/byteHub.html">
  <meta property="og:title" content="ByteHub — The tech pulse">
  <meta property="og:description" content="Real GitHub trending repos, verified conference dates, new podcast episodes, and all 26 sources.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ibbuweb.github.io/ByteBrief/byteHub.html">
  <meta property="og:image" content="https://ibbuweb.github.io/ByteBrief/assets/bytebrief-logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/bytebrief-logo.png">
  <link rel="apple-touch-icon" href="assets/bytebrief-logo.png">
  <link rel="manifest" href="manifest.json">
  <title>ByteHub — ByteBrief</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body data-page="hub">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="shell page">
    <div class="page-head">
      <div>
        <span class="eyebrow">ByteHub</span>
        <h1>The tech pulse.</h1>
        <p>What developers are starring, where the industry is meeting, what is worth listening to, and every publication behind the brief.</p>
      </div>
      <span class="updated-note" id="hubUpdated">Loading data…</span>
    </div>

    <section class="bento pulse-grid" id="pulseGrid" aria-label="Tech pulse">
      <div class="skeleton skeleton-card span-4"></div>
      <div class="skeleton skeleton-card span-4"></div>
      <div class="skeleton skeleton-card span-4"></div>
    </section>

    <div class="hub-toolbar">
      <div class="tabs" id="hubTabs" role="tablist" aria-label="ByteHub sections"></div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input type="search" class="search-input" id="hubSearch" placeholder="Search…" aria-label="Search the active section">
        <button type="button" class="search-clear is-hidden" id="hubClearSearch" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>
    </div>

    <section id="hubPanel" class="hub-panel" aria-live="polite" aria-busy="true">
      <div class="loading-panel"><span class="spinner" aria-hidden="true"></span> Loading the hub…</div>
    </section>
    <div id="hubEmpty"></div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-message"></span>
  </div>

  <script type="module" src="js/hub.js"></script>
</body>
</html>
