<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b11">
  <meta name="description" content="Your ByteBrief reading list: saved tech stories synced with Google sign-in.">
  <meta name="author" content="ByteBrief">
  <link rel="canonical" href="https://ibbuweb.github.io/ByteBrief/saved.html">
  <meta property="og:title" content="Saved reading — ByteBrief">
  <meta property="og:description" content="Keep the tech stories you want to read later.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ibbuweb.github.io/ByteBrief/saved.html">
  <meta property="og:image" content="https://ibbuweb.github.io/ByteBrief/assets/bytebrief-logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/bytebrief-logo.png">
  <link rel="apple-touch-icon" href="assets/bytebrief-logo.png">
  <link rel="manifest" href="manifest.json">
  <title>Saved reading — ByteBrief</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body data-page="saved">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="shell page">
    <div class="page-head">
      <div>
        <span class="eyebrow">Reading list</span>
        <h1>Saved reading.</h1>
        <p>The stories you set aside, synced to your Google account. Public reading stays open; saving needs a sign-in.</p>
      </div>
      <a class="btn btn-outline btn-sm" href="index.html">Browse today's brief</a>
    </div>

    <div id="savedRoot" aria-live="polite">
      <div class="loading-panel"><span class="spinner" aria-hidden="true"></span> Checking your reading list…</div>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-message"></span>
  </div>

  <script type="module" src="js/saved.js"></script>
</body>
</html>
