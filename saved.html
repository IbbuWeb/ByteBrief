<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var KEY = 'bytebrief_force_refresh_once_v20261110_1';
      try {
        if (localStorage.getItem(KEY) !== '1') {
          localStorage.setItem(KEY, '1');
          var url = new URL(window.location.href);
          url.searchParams.set('_refresh', Date.now().toString());
          window.location.replace(url.toString());
          return;
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171410">
  <meta name="description" content="Your ByteBrief reading list: saved tech stories synced with Google sign-in.">
  <meta name="author" content="ByteBrief">
  <link rel="canonical" href="https://ibbuweb.github.io/ByteBrief/saved.html">
  <meta property="og:title" content="Saved reading — ByteBrief">
  <meta property="og:description" content="Keep the tech stories you want to read later.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ibbuweb.github.io/ByteBrief/saved.html">
  <meta property="og:image" content="https://ibbuweb.github.io/ByteBrief/assets/bytebrief-logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="assets/bytebrief-logo.png">
  <link rel="apple-touch-icon" href="assets/bytebrief-logo.png">
  <link rel="manifest" href="manifest.json">
  <title>Saved reading — ByteBrief</title>
  <link rel="stylesheet" href="css/styles.css?v=20261110-1">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body data-page="saved">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="shell page">
    <div class="page-head">
      <div>
        <span class="eyebrow">Reading list</span>
        <h1>Saved reading.</h1>
        <p>The stories you set aside, synced to your Google account. Public reading stays open; saving needs a sign-in.</p>
      </div>
      <a class="btn btn-outline btn-sm" href="index.html">Browse today's brief</a>
    </div>

    <div id="savedRoot" aria-live="polite">
      <div class="loading-panel"><span class="spinner" aria-hidden="true"></span> Checking your reading list…</div>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>

  <div class="modal" id="articleModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="document">
      <button type="button" class="modal-close" data-close-modal aria-label="Close story preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-body">
        <div class="cluster">
          <span class="pill pill-accent" id="modalCategory">Tech</span>
          <span class="pill" id="modalSource">Source</span>
        </div>
        <h2 id="modalTitle">Story</h2>
        <p class="modal-meta" id="modalMeta"></p>
        <p class="modal-description" id="modalDescription"></p>
        <div class="modal-actions">
          <a class="btn btn-primary" id="modalRead" href="#" target="_blank" rel="noopener noreferrer">Read full story</a>
          <button type="button" class="btn btn-outline js-save-btn" id="modalSave" data-action="save">
            <span class="js-save-label">Saved</span>
          </button>
          <button type="button" class="btn btn-ghost" id="modalShare" data-action="share">Share</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-message"></span>
  </div>

  <script type="module" src="js/saved.js?v=20261110-1"></script>
</body>
</html>
